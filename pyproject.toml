[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "img2ultrahdr"
version = "0.3.0"
description = "Convert camera RAW and standard images into natural SDR and Ultra HDR JPEGs"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT AND LicenseRef-IntrinsicHDR-Academic"
license-files = ["LICENSE", "docs/licenses/IntrinsicHDR.txt"]
dependencies = [
  "numpy>=1.26,<3",
  "tifffile>=2023.4",
  "Pillow>=10,<13",
  "colour-science>=0.4.4,<0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
jpeg-hdr = [
  "numpy>=1.26,<2",
  "torch==2.5.1",
  "torchvision==0.20.1",
  "opencv-contrib-python-headless==4.10.0.84",
  "geffnet==1.0.2",
  "timm==0.9.12",
  "hydra-core==1.3.2",
  "iopath==0.1.10",
  "tqdm==4.67.1",
  "requests>=2.32.3,<3",
  "zstandard==0.23.0",
]

[project.scripts]
img2uhdr = "hdrimg.cli:main"
hdrimg = "hdrimg.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hdrimg = ["profiles/*.pp3", "profiles/*.b64", "profiles/*.swift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: exercises installed external codecs"]
